# Independent localhost cutover stack for the managed Supabase project.
#
# This file does not extend the legacy persistence compose and declares no local
# Postgres or durable application-data volume. Use scripts/supabase-compose.ps1;
# it supplies an explicit 4/8/16 capacity tier and two worker replicas.
name: openmaic-supabase

x-public-build-args: &public-build-args
  ALPINE_MIRROR: ${ALPINE_MIRROR:-}
  NPM_REGISTRY: ${NPM_REGISTRY:-}
  ALLOWED_FRAME_ANCESTORS: ${ALLOWED_FRAME_ANCESTORS:-}
  NEXT_PUBLIC_PERSISTENCE: ${NEXT_PUBLIC_PERSISTENCE:?Set NEXT_PUBLIC_PERSISTENCE=1}
  NEXT_PUBLIC_PERSISTENCE_TOKEN: ${NEXT_PUBLIC_PERSISTENCE_TOKEN:-}
  NEXT_PUBLIC_MAIC_EDITOR_ENABLED: ${NEXT_PUBLIC_MAIC_EDITOR_ENABLED:?Preserve the editor feature flag}
  NEXT_PUBLIC_PRO_WORKBENCH_ENABLED: ${NEXT_PUBLIC_PRO_WORKBENCH_ENABLED:?Preserve the Pro workbench feature flag}
  NEXT_PUBLIC_MAIC_EDITOR_RENDERER_ENABLED: ${NEXT_PUBLIC_MAIC_EDITOR_RENDERER_ENABLED:?Preserve the editor renderer feature flag}
  NEXT_PUBLIC_MAIC_PLAYBACK_RENDERER_ENABLED: ${NEXT_PUBLIC_MAIC_PLAYBACK_RENDERER_ENABLED:?Preserve the classroom renderer feature flag}
  NEXT_PUBLIC_PI_CHAT_ENABLED: ${NEXT_PUBLIC_PI_CHAT_ENABLED:?Preserve the classroom assistant feature flag}
  NEXT_PUBLIC_LEARNING_CHECKS_ENABLED: ${NEXT_PUBLIC_LEARNING_CHECKS_ENABLED:?Preserve learning checks}
  NEXT_PUBLIC_GUIDED_LEARNING_ENABLED: ${NEXT_PUBLIC_GUIDED_LEARNING_ENABLED:?Preserve guided learning}
  NEXT_PUBLIC_TEACH_BACK_ENABLED: ${NEXT_PUBLIC_TEACH_BACK_ENABLED:?Preserve teach-back}
  NEXT_PUBLIC_SHOW_VOCATIONAL_TEST_UI: ${NEXT_PUBLIC_SHOW_VOCATIONAL_TEST_UI:-}
  NEXT_PUBLIC_ENABLE_VIDEO_EXPORT: ${NEXT_PUBLIC_ENABLE_VIDEO_EXPORT:?Preserve classroom export}
  NEXT_PUBLIC_VIDEO_EXPORT_CTA_DESTINATION: ${NEXT_PUBLIC_VIDEO_EXPORT_CTA_DESTINATION:-}
  NEXT_PUBLIC_ENABLE_PPTX_IMPORT: ${NEXT_PUBLIC_ENABLE_PPTX_IMPORT:?Preserve PPTX import}
  NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:?Set NEXT_PUBLIC_AUTH_MODE=supabase}
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the existing project URL}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set the publishable key}
  OPENMAIC_SOURCE_REVISION: ${OPENMAIC_SOURCE_REVISION:-unknown}

x-db-ca-secrets: &db-ca-secrets
  - source: supabase-db-ca
    target: supabase-db-ca.crt
    mode: 0444

# Only explicitly enumerated values enter containers. In particular the
# Supabase secret/service key and privileged migration URL are intentionally
# absent. Web and workers receive the same Supabase project, Storage, model and
# snapshot-encryption configuration, while their database login roles remain
# separate. The Pro model key is server-only and is shared only with Web and
# the background worker that must decrypt the owner's frozen model binding.
x-runtime-environment: &runtime-environment
  NODE_ENV: production
  SUPABASE_DB_SSL_ROOT_CERT_PATH: /run/secrets/supabase-db-ca.crt
  AUTH_MODE: supabase
  NEXT_PUBLIC_AUTH_MODE: supabase
  NEXT_PUBLIC_PERSISTENCE: '1'
  NEXT_PUBLIC_PERSISTENCE_TOKEN: ${NEXT_PUBLIC_PERSISTENCE_TOKEN:-}
  NEXT_PUBLIC_MAIC_EDITOR_ENABLED: ${NEXT_PUBLIC_MAIC_EDITOR_ENABLED:?Preserve the editor feature flag}
  NEXT_PUBLIC_PRO_WORKBENCH_ENABLED: ${NEXT_PUBLIC_PRO_WORKBENCH_ENABLED:?Preserve the Pro workbench feature flag}
  NEXT_PUBLIC_MAIC_EDITOR_RENDERER_ENABLED: ${NEXT_PUBLIC_MAIC_EDITOR_RENDERER_ENABLED:?Preserve the editor renderer feature flag}
  NEXT_PUBLIC_MAIC_PLAYBACK_RENDERER_ENABLED: ${NEXT_PUBLIC_MAIC_PLAYBACK_RENDERER_ENABLED:?Preserve the classroom renderer feature flag}
  NEXT_PUBLIC_PI_CHAT_ENABLED: ${NEXT_PUBLIC_PI_CHAT_ENABLED:?Preserve the classroom assistant feature flag}
  NEXT_PUBLIC_LEARNING_CHECKS_ENABLED: ${NEXT_PUBLIC_LEARNING_CHECKS_ENABLED:?Preserve learning checks}
  NEXT_PUBLIC_GUIDED_LEARNING_ENABLED: ${NEXT_PUBLIC_GUIDED_LEARNING_ENABLED:?Preserve guided learning}
  NEXT_PUBLIC_TEACH_BACK_ENABLED: ${NEXT_PUBLIC_TEACH_BACK_ENABLED:?Preserve teach-back}
  NEXT_PUBLIC_SHOW_VOCATIONAL_TEST_UI: ${NEXT_PUBLIC_SHOW_VOCATIONAL_TEST_UI:-}
  NEXT_PUBLIC_ENABLE_VIDEO_EXPORT: ${NEXT_PUBLIC_ENABLE_VIDEO_EXPORT:?Preserve classroom export}
  NEXT_PUBLIC_VIDEO_EXPORT_CTA_DESTINATION: ${NEXT_PUBLIC_VIDEO_EXPORT_CTA_DESTINATION:-}
  NEXT_PUBLIC_ENABLE_PPTX_IMPORT: ${NEXT_PUBLIC_ENABLE_PPTX_IMPORT:?Preserve PPTX import}
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the existing project URL}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set the publishable key}
  APP_ORIGIN: http://localhost:3000
  MEDIA_CONFIG_ENCRYPTION_KEY: ${MEDIA_CONFIG_ENCRYPTION_KEY:?Set the shared media snapshot key}
  GENERATION_MODEL_ENCRYPTION_KEY: ${GENERATION_MODEL_ENCRYPTION_KEY:?Set the shared generation snapshot key}
  GENERATION_SESSION_SECRET: ${GENERATION_SESSION_SECRET:?Set the stable session signing secret}
  GENERATION_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  GENERATION_TRUST_LEGACY_OWNER: '0'
  GENERATION_ACCEPTING_JOBS: ${GENERATION_ACCEPTING_JOBS:-0}
  OPENMAIC_AGENT_RUNTIME_ENABLED: 'true'
  # Remote PG checkout can take 10s: leave room for delayed/missed heartbeats.
  # Match ordinary generation leases; all hosted claim/admission paths agree.
  OPENMAIC_AGENT_RUNTIME_LEASE_TTL_MS: '90000'
  OPENMAIC_AGENT_RUNTIME_HEARTBEAT_MS: '10000'
  OPENMAIC_AGENT_RUNTIME_MAX_CONCURRENT: ${OPENMAIC_AGENT_RUNTIME_MAX_CONCURRENT:?Selected by the capacity launcher}
  APP_HEAVY_TASK_LIMIT: ${APP_HEAVY_TASK_LIMIT:?Selected by the capacity launcher}
  APP_HEAVY_TASK_PER_OWNER_LIMIT: '2'
  GENERATION_WORKER_CONCURRENCY: ${GENERATION_WORKER_CONCURRENCY:?Selected by the capacity launcher}
  PARALLEL_SCENE_CONCURRENCY: '1'
  GENERATION_LLM_MAX_INFLIGHT: ${GENERATION_LLM_MAX_INFLIGHT:?Selected by the capacity launcher}
  GENERATION_TTS_CONCURRENCY: ${GENERATION_TTS_CONCURRENCY:-2}
  TTS_REQUEST_TIMEOUT_MS: ${TTS_REQUEST_TIMEOUT_MS:-120000}
  GENERATION_MEDIA_CONCURRENCY: ${GENERATION_MEDIA_CONCURRENCY:-1}
  GENERATION_MAX_QUEUED_JOBS_PER_OWNER: ${GENERATION_MAX_QUEUED_JOBS_PER_OWNER:-5}
  GENERATION_MAX_QUEUED_JOBS: ${GENERATION_MAX_QUEUED_JOBS:-100}
  GENERATION_MAX_REVIEW_ATTENTION_JOBS_PER_OWNER: ${GENERATION_MAX_REVIEW_ATTENTION_JOBS_PER_OWNER:-5}
  GENERATION_MAX_REVIEW_ATTENTION_JOBS: ${GENERATION_MAX_REVIEW_ATTENTION_JOBS:-100}
  GENERATION_QUEUE_WAIT_MS: ${GENERATION_QUEUE_WAIT_MS:-3600000}
  GENERATION_MANUAL_REVIEW_WAIT_MS: ${GENERATION_MANUAL_REVIEW_WAIT_MS:-86400000}
  OPENMAIC_CAPACITY_TIER: ${OPENMAIC_CAPACITY_TIER:?Selected by the capacity launcher}
  ASSET_BYTE_BACKEND: s3
  ASSET_S3_BUCKET: ${ASSET_S3_BUCKET:?Set the private asset bucket}
  ASSET_S3_ENDPOINT: ${ASSET_S3_ENDPOINT:?Set the Supabase S3 endpoint}
  ASSET_S3_REGION: ${ASSET_S3_REGION:?Set the Supabase S3 region}
  ASSET_S3_FORCE_PATH_STYLE: ${ASSET_S3_FORCE_PATH_STYLE:-true}
  ASSET_S3_ACCESS_KEY_ID: ${ASSET_S3_ACCESS_KEY_ID:?Set the server-only S3 access key}
  ASSET_S3_SECRET_ACCESS_KEY: ${ASSET_S3_SECRET_ACCESS_KEY:?Set the server-only S3 secret}
  ASSET_BYTE_EGRESS: direct
  ASSET_COLLECTION_ENABLED: 'false'
  MATERIAL_BYTE_BACKEND: s3
  MATERIAL_S3_BUCKET: ${MATERIAL_S3_BUCKET:?Set the private material bucket}
  CLASSROOM_S3_BUCKET: ${CLASSROOM_S3_BUCKET:?Set the private classroom snapshot bucket}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-}
  # Subscription sign-in (model gateway R2). Optional: without the key no
  # provider offers sign-in. The generation worker reads signed-in credentials
  # before each model call, so web and worker need the same credential key.
  MODEL_OAUTH_PROVIDERS: ${MODEL_OAUTH_PROVIDERS:-}
  MODEL_OAUTH_DEVICE_ID: ${MODEL_OAUTH_DEVICE_ID:-}
  MODEL_CREDENTIAL_ENCRYPTION_KEY: ${MODEL_CREDENTIAL_ENCRYPTION_KEY:-}
  MODEL_CREDENTIAL_KEY_VERSION: ${MODEL_CREDENTIAL_KEY_VERSION:-}
  MODEL_CREDENTIAL_RETIRED_KEYS: ${MODEL_CREDENTIAL_RETIRED_KEYS:-}
  MODEL_ROUTES: ${MODEL_ROUTES:-}
  # Study spaces (learning plan B01). Turn on only after accounts v22 is applied.
  ZHIYU_STUDY_SPACES_ENABLED: ${ZHIYU_STUDY_SPACES_ENABLED:-}
  # Study material library + learning-task runner in the worker (B02). Needs
  # accounts v23 and ZHIYU_STUDY_SPACES_ENABLED. ACCEPTING=0 stops new parses.
  ZHIYU_STUDY_MATERIALS_ENABLED: ${ZHIYU_STUDY_MATERIALS_ENABLED:-}
  ZHIYU_STUDY_TASKS_ACCEPTING: ${ZHIYU_STUDY_TASKS_ACCEPTING:-}
  LEARNING_TASK_WORKER_CONCURRENCY: ${LEARNING_TASK_WORKER_CONCURRENCY:-1}
  # Retrieval + cited answers (B03). Needs accounts v24 with vector/pgroonga;
  # the worker builds indexes, the web answers. Embeddings are operator-funded.
  ZHIYU_STUDY_QA_ENABLED: ${ZHIYU_STUDY_QA_ENABLED:-}
  STUDY_EMBEDDING_MODEL: ${STUDY_EMBEDDING_MODEL:-}
  STUDY_EMBEDDING_DIMENSIONS: ${STUDY_EMBEDDING_DIMENSIONS:-1024}
  STUDY_EMBEDDING_SEND_DIMENSIONS: ${STUDY_EMBEDDING_SEND_DIMENSIONS:-}
  # Classmate templates (B04). Needs accounts v25; web and worker (Pro) read it.
  ZHIYU_STUDY_CLASSMATES_ENABLED: ${ZHIYU_STUDY_CLASSMATES_ENABLED:-}
  ZHIYU_DEFAULT_TEXT_MODEL: ${ZHIYU_DEFAULT_TEXT_MODEL:-}
  ZHIYU_DEFAULT_TEXT_DISPLAY_NAME: ${ZHIYU_DEFAULT_TEXT_DISPLAY_NAME:-}
  ZHIYU_DEFAULT_TEXT_ENABLED: ${ZHIYU_DEFAULT_TEXT_ENABLED:-}
  ZHIYU_DEFAULT_TEXT_THINKING_MODE: ${ZHIYU_DEFAULT_TEXT_THINKING_MODE:-disabled}
  ZHIYU_DEFAULT_TEXT_THINKING_EFFORT: ${ZHIYU_DEFAULT_TEXT_THINKING_EFFORT:-none}
  ZHIYU_DEFAULT_IMAGE_MODEL: ${ZHIYU_DEFAULT_IMAGE_MODEL:-}
  ZHIYU_DEFAULT_IMAGE_DISPLAY_NAME: ${ZHIYU_DEFAULT_IMAGE_DISPLAY_NAME:-}
  ZHIYU_DEFAULT_IMAGE_ENABLED: ${ZHIYU_DEFAULT_IMAGE_ENABLED:-}
  ZHIYU_DEFAULT_VIDEO_MODEL: ${ZHIYU_DEFAULT_VIDEO_MODEL:-}
  ZHIYU_DEFAULT_VIDEO_DISPLAY_NAME: ${ZHIYU_DEFAULT_VIDEO_DISPLAY_NAME:-}
  ZHIYU_DEFAULT_VIDEO_ENABLED: ${ZHIYU_DEFAULT_VIDEO_ENABLED:-}
  ZHIYU_DEFAULT_TTS_MODEL: ${ZHIYU_DEFAULT_TTS_MODEL:-}
  ZHIYU_DEFAULT_TTS_DISPLAY_NAME: ${ZHIYU_DEFAULT_TTS_DISPLAY_NAME:-}
  ZHIYU_DEFAULT_TTS_ENABLED: ${ZHIYU_DEFAULT_TTS_ENABLED:-}
  ZHIYU_DEFAULTS_REVISION: ${ZHIYU_DEFAULTS_REVISION:-1}
  ZHIYU_DEFAULTS_REVISION_SECRET: ${ZHIYU_DEFAULTS_REVISION_SECRET:-}
  LLM_THINKING_DISABLED: ${LLM_THINKING_DISABLED:-}
  OPENMAIC_ENABLE_VOCATIONAL: ${OPENMAIC_ENABLE_VOCATIONAL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_MODELS: ${OPENAI_MODELS:-}
