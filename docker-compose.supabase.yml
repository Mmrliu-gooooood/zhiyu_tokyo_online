services:
  openmaic:
    image: zhiyu-supabase-web:local
    build:
      context: .
      target: runner
      args: *public-build-args
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      <<: *runtime-environment
      GENERATION_BACKGROUND_ENABLED: ${GENERATION_BACKGROUND_ENABLED:?Selected by the capacity launcher}
      DATABASE_URL: ${DATABASE_URL_APP_WEB:?Set the app_web pooled URL}
      DATABASE_LISTEN_URL_APP_WEB: ${DATABASE_LISTEN_URL_APP_WEB:?Set a session/direct app_web URL for Web SSE LISTEN}
      PRO_MODEL_ENCRYPTION_KEY: ${PRO_MODEL_ENCRYPTION_KEY:?Set the shared server-only Pro model key}
      ACCESS_CODE: ${ACCESS_CODE:-}
      ASR_OPENAI_API_KEY: ${ASR_OPENAI_API_KEY:-}
      ASR_OPENAI_BASE_URL: ${ASR_OPENAI_BASE_URL:-}
      ASR_QWEN_API_KEY: ${ASR_QWEN_API_KEY:-}
      ASR_QWEN_BASE_URL: ${ASR_QWEN_BASE_URL:-}
      ASR_AZURE_API_KEY: ${ASR_AZURE_API_KEY:-}
      ASR_AZURE_BASE_URL: ${ASR_AZURE_BASE_URL:-}
      ASR_FUNASR_BASE_URL: ${ASR_FUNASR_BASE_URL:-}
      ASR_LEMONADE_BASE_URL: ${ASR_LEMONADE_BASE_URL:-}
      ASR_OPENAI_ENABLED: ${ASR_OPENAI_ENABLED:-}
      ASR_BROWSER_NATIVE_ENABLED: ${ASR_BROWSER_NATIVE_ENABLED:-}
      RENDER_SERVICE_URL: http://render-service:9000
    secrets: *db-ca-secrets
    tmpfs:
      - /app/data:uid=1001,gid=1001,mode=0770
      - /tmp:uid=1001,gid=1001,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [default, render]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  generation-worker:
    image: zhiyu-supabase-worker:local
    build:
      context: .
      target: generation-worker
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        OPENMAIC_SOURCE_REVISION: ${OPENMAIC_SOURCE_REVISION:-unknown}
    environment:
      <<: *runtime-environment
      # The worker must stay enabled while the Web process can be switched to
      # foreground mode for its independent protected-flow acceptance run.
      GENERATION_BACKGROUND_ENABLED: '1'
      DATABASE_URL: ${WORKER_DATABASE_URL:?Set the app_worker pooled URL}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?Set the app_worker pooled URL}
      DATABASE_LISTEN_URL: ${DATABASE_LISTEN_URL:?Set a session/direct app_worker URL for LISTEN}
      PRO_MODEL_ENCRYPTION_KEY: ${PRO_MODEL_ENCRYPTION_KEY:?Set the shared server-only Pro model key}
      # Only the worker (app_worker may delete blobs) reclaims unreferenced
      # asset bytes; the Web role cannot, so it keeps collection off.
      ASSET_COLLECTION_ENABLED: ${WORKER_ASSET_COLLECTION_ENABLED:-false}
      # Physical purge of deleted courses (content, generation records, media).
      # COURSE_PURGE_DELETED_SINCE limits it to courses deleted at/after that
      # ISO instant; unset purges every tombstoned course.
      COURSE_PURGE_ENABLED: ${COURSE_PURGE_ENABLED:-}
      COURSE_PURGE_DELETED_SINCE: ${COURSE_PURGE_DELETED_SINCE:-}
      COURSE_PURGE_GRACE_MS: ${COURSE_PURGE_GRACE_MS:-}
    secrets: *db-ca-secrets
    tmpfs:
      - /app/data:uid=1001,gid=1001,mode=0770
      - /tmp:uid=1001,gid=1001,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [default]
    restart: unless-stopped
    stop_grace_period: 45s
    init: true
    healthcheck:
      test: ['CMD', 'node', 'dist-worker/generation.mjs', '--check']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  supabase-readiness:
    image: zhiyu-supabase-worker:local
    profiles: [ops]
    environment:
      <<: *runtime-environment
      GENERATION_BACKGROUND_ENABLED: '1'
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?Set the app_worker pooled URL}
      ACCOUNTS_SCHEMA_REQUIRED: '19'
      GENERATION_SCHEMA_REQUIRED: '4'
      GENERATION_PIPELINE_REQUIRED: '2'
      GENERATION_EXPECTED_WORKERS: '2'
    secrets: *db-ca-secrets
    command: ['node', 'scripts/check-supabase-readiness.mjs']
    networks: [default]
    restart: 'no'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Preserve the existing MP4 export execution path. It remains an explicit
  # resource profile because the standard renderer alone requires 8 GiB; the
  # Web capability probe falls back to the existing ZIP export when it is off.
  render-service:
    build: ./render-service
    profiles: [video-export]
    expose: ['9000']
    cap_add: [NET_ADMIN]
    environment:
      PORT: '9000'
      RENDER_RESOURCE_PROFILE: ${RENDER_RESOURCE_PROFILE:-standard}
      RENDER_CHUNK_EXECUTION: ${RENDER_CHUNK_EXECUTION:-false}
      RENDER_CHUNK_COUNT: ${RENDER_CHUNK_COUNT:-1}
      RENDER_CHUNK_WORKERS: ${RENDER_CHUNK_WORKERS:-1}
      RENDER_MAX_PARALLEL_CHUNKS: ${RENDER_MAX_PARALLEL_CHUNKS:-1}
      RENDER_CHUNK_SIZE_FRAMES: ${RENDER_CHUNK_SIZE_FRAMES:-0}
      RENDER_TARGET_CHUNK_FRAMES: ${RENDER_TARGET_CHUNK_FRAMES:-0}
      PRODUCER_HEADLESS_SHELL_PATH: /usr/bin/chromium-headless-shell
      RENDER_MAX_CONCURRENCY: '1'
      RENDER_MAX_CONCURRENT_EXTRACTIONS: '1'
      PRODUCER_PUPPETEER_PROTOCOL_TIMEOUT_MS: '900000'
      HF_STATIC_DEDUP: 'false'
      RENDER_MAX_JOBS_PER_USER: '0'
    mem_limit: ${RENDER_SERVICE_MEMORY_LIMIT:-8g}
    shm_size: 2gb
    networks: [render]
    restart: unless-stopped

networks:
  default: {}
  render:
    internal: true

secrets:
  supabase-db-ca:
    file: ${SUPABASE_DB_SSL_ROOT_CERT_PATH:?Set the downloaded Supabase database CA path}
