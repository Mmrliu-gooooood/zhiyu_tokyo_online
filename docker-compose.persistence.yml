services:
  postgres:
    image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_PASSWORD: ${PERSISTENCE_POSTGRES_PASSWORD:?Use the verified existing role password}
  openmaic:
    image: zhiyu:latest
    container_name: zhiyu
    ports: !override
      - '127.0.0.1:3000:3000'
    env_file: !reset []
    environment:
      <<: *generation-environment
      PRO_MODEL_ENCRYPTION_KEY: ${PRO_MODEL_ENCRYPTION_KEY:?Persistent 32-byte hex encryption key required}
      PERSISTENCE_DEV_TOKEN: ${PERSISTENCE_DEV_TOKEN:?Persistence token required}
      GENERATION_SESSION_SECRET: ${GENERATION_SESSION_SECRET:?Stable signing secret required}
      GENERATION_ALLOWED_ORIGINS: ${GENERATION_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GENERATION_TRUST_LEGACY_OWNER: ${GENERATION_TRUST_LEGACY_OWNER:-0}
      OPENMAIC_AGENT_RUNTIME_ENABLED: ${OPENMAIC_AGENT_RUNTIME_ENABLED:-}
      ACCESS_CODE: ${ACCESS_CODE:-}
      ASR_OPENAI_API_KEY: ${ASR_OPENAI_API_KEY:-}
      ASR_OPENAI_BASE_URL: ${ASR_OPENAI_BASE_URL:-}
      ASR_QWEN_API_KEY: ${ASR_QWEN_API_KEY:-}
      ASR_QWEN_BASE_URL: ${ASR_QWEN_BASE_URL:-}
      ASR_AZURE_API_KEY: ${ASR_AZURE_API_KEY:-}
      ASR_AZURE_BASE_URL: ${ASR_AZURE_BASE_URL:-}
      ASR_FUNASR_BASE_URL: ${ASR_FUNASR_BASE_URL:-}
      ASR_LEMONADE_BASE_URL: ${ASR_LEMONADE_BASE_URL:-}
      ASR_OPENAI_ENABLED: ${ASR_OPENAI_ENABLED:-}
      ASR_BROWSER_NATIVE_ENABLED: ${ASR_BROWSER_NATIVE_ENABLED:-}
      ASSET_COLLECTION_ENABLED: ${ASSET_COLLECTION_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    build:
      args:
        NEXT_PUBLIC_PERSISTENCE: ${NEXT_PUBLIC_PERSISTENCE:?Set to 1 at build time}
        NEXT_PUBLIC_PERSISTENCE_TOKEN: ${NEXT_PUBLIC_PERSISTENCE_TOKEN:?Public compatibility token required}
        NEXT_PUBLIC_PRO_WORKBENCH_ENABLED: ${NEXT_PUBLIC_PRO_WORKBENCH_ENABLED:-}
  generation-worker:
    image: zhiyu-worker:latest
    container_name: zhiyu-worker
    profiles: [server-persistence]
    build:
      context: .
      target: generation-worker
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    environment: *generation-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default]
    restart: unless-stopped
    stop_grace_period: 45s
    init: true
    healthcheck:
      test: ['CMD', 'node', 'dist-worker/generation.mjs', '--check']
      interval: 15s
      timeout: 10s
      retries: 3
volumes:
  openmaic-postgres:
    external: true
    name: openmaic-main_openmaic-postgres
  openmaic-data:
    external: true
    name: openmaic-main_openmaic-data
