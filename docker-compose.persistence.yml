# Existing volumes are mandatory. This file never creates a replacement database.
# Use scripts/generation-compose.ps1 for one consistent project/env/override entry.
x-generation-environment: &generation-environment
  DATABASE_URL: ${DATABASE_URL:?Persist the verified existing database URL in .env.local}
  # Web and worker decrypt owner-scoped media and generation-model snapshots with
  # dedicated keys. The worker must not receive the unrelated PRO model key.
  MEDIA_CONFIG_ENCRYPTION_KEY: ${MEDIA_CONFIG_ENCRYPTION_KEY:?Persistent 32-byte hex media snapshot key required}
  GENERATION_MODEL_ENCRYPTION_KEY: ${GENERATION_MODEL_ENCRYPTION_KEY:?Persistent 32-byte hex generation model snapshot key required}
